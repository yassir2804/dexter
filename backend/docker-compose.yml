version: "3.8"

services:
  db:
    image: postgres:15
    container_name: dexter-db
    restart: always
    environment:
      - POSTGRES_USER=dexter
      - POSTGRES_PASSWORD=dexter
      - POSTGRES_DB=dexter
    ports:
      - '5432:5432'

  app:
    image: openjdk:17-jdk-slim
    container_name: dexter-backend
    ports:
      - '8081:8080'
    volumes:
      - ./build/libs:/app
    working_dir: /app
    command: java -jar backend-swap-delta-0.0.1-SNAPSHOT.jar
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/dexter
      - SPRING_DATASOURCE_USERNAME=dexter
      - SPRING_DATASOURCE_PASSWORD=dexter
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop
      - SPRING_PROFILES_ACTIVE=default
    depends_on:
      - db
