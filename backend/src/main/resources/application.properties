spring.application.name=dexter-backend
spring.profiles.active=dev

# Server
server.port=3000

# Banner
spring.banner.location=banner.txt

# Webservice - URL versioning (OpenAPI path-based)
vs=v1
url.login=/${vs}/users/login
url.health=${vs}/health
url.auth.register=/${vs}/auth/register
url.users=${vs}/users
url.user.signup=/${url.users}/signup
url.profile=${vs}/profile-summary
url.matches=${vs}/matches
url.matchSummaries=${vs}/match-summaries
url.search=${vs}/search
url.unsecure=${vs}/unsecure

# Phase 7: recursos planeados (controladores esqueleto — TODO fase 8+)
url.sessions=${vs}/sessions
url.sessionInvitations=${vs}/session-invitations
url.reviews=${vs}/reviews
url.reviewTags=${vs}/review-tags
url.notifications=${vs}/notifications
url.availability=${vs}/availability
